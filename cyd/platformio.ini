; Cheap Yellow Display clone: Freenove FNK0114B, 2.8" ST7789 240x320, ESP32-WROOM-32E
; LVGL control panel for the ha-api switch endpoints
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.2.0
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; Required so TFT_eSPI uses the -D flags below instead of its bundled User_Setup.h
  -D USER_SETUP_LOADED=1
  ; --- TFT_eSPI config for the Freenove 2.8" ST7789 (FNK0114B) ---
  -D ST7789_DRIVER
  ; TFT_BGR is the proven MADCTL order for this FNK0114B panel (csstats sketch)
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D SPI_FREQUENCY=80000000
  ; --- LVGL ---
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
