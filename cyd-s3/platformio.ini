; Freenove FNK0104N: ESP32-S3 CYD, 3.5" ST77922 QSPI TDDI 320x480 IPS,
; integrated capacitive touch (I2C). 8MB embedded PSRAM, 16MB flash, USB-C.
; LVGL control panel for the ha-api switch endpoints
[env:cyd-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps =
  lvgl/lvgl@^9.2.0
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D BOARD_HAS_PSRAM
  ; Native USB-Serial/JTAG: keep Serial working on the USB-C port
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; --- LVGL ---
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  ; ST77922 QSPI driver lives in lib/ST77922 (no TFT_eSPI needed on this board)
